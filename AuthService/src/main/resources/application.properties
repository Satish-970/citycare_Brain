spring.application.name=AuthService
server.port=8091
server.servlet.context-path=/api
jwt.secret=Y2Y4ZTM1YmYtYjYyMC00ZDllLTlhZTMtZDY2ZDU4ZTMxZmE5Cg==
jwt.expiration.ms=1800000


spring.datasource.url=jdbc:mysql://localhost:3306/citycare_auth
spring.datasource.username=root
spring.datasource.password=root



# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# OpenFeign configuration
spring.cloud.openfeign.circuitbreaker.enabled=true

# Feign timeouts — fail fast so callers (FacilityService) are not blocked
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect